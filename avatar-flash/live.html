<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Anchor</title>
<!--
  Her reading what you type, on this machine (live.sh starts the server and opens this page).
  Each text becomes her voice (POST /tts) and her pictures (POST /say, one slice at a time). She
  begins speaking once enough is drawn that she will not have to stop; on a slow card that is a
  while for a long text, and meanwhile she sits in her quiet loop. If her pictures still fall
  behind, her voice waits for them, so her lips never leave her voice.
  Auto: each text is spoken as soon as it can be. Off: texts are prepared and wait for their play
  button (for speeches written beforehand). Keys: Ctrl+Enter speak, F full screen, T show or hide
  the panel in full screen. ?lipLag=<ms> moves her pictures against her voice (50 by default).
-->
<style>
  :root { color-scheme: dark; --red: #d0021b; --panel: rgba(16, 18, 24, 0.94); --line: #2a2f3a; --text: #e8e8ea; --dim: #9aa0aa; --accent: #3b82f6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #view { position: relative; flex: 1; min-height: 0; }
  #stage { position: absolute; inset: 0; margin: auto; width: min(100%, calc((100vh - var(--bar, 0px)) * 4 / 3)); aspect-ratio: 4 / 3; max-height: 100%; background: #000 center / cover no-repeat; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #a, #b { opacity: 0; transition: opacity 150ms linear; }
  .live { position: absolute; left: 2.4%; top: 3.2%; background: var(--red); color: #fff; font-weight: 700; letter-spacing: 0.08em; padding: 0.18em 0.55em; border-radius: 3px; font-size: clamp(11px, 1.7vw, 22px); z-index: 3; }
  .clock { position: absolute; right: 2.6%; top: 3.2%; color: #fff; font-weight: 600; font-size: clamp(12px, 1.9vw, 24px); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75); z-index: 3; }
  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 14px 12px; display: grid; grid-template-columns: 1fr 340px; gap: 12px; }
  body.full #panel { position: absolute; left: 0; right: 0; bottom: 0; transform: translateY(100%); transition: transform 200ms; }
  body.full.show #panel { transform: none; }
  textarea { width: 100%; height: 92px; resize: vertical; background: #0d0f14; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 16px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; color: var(--dim); }
  select, button, label.file { background: #171b24; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 14px; }
  button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 6px 18px; }
  button:disabled { opacity: 0.5; }
  label.file input { display: none; }
  #list { list-style: none; margin: 0; padding: 0; max-height: 128px; overflow: auto; font-size: 13px; }
  #list li { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  #list li .what { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list li .state { color: var(--dim); white-space: nowrap; }
  #list li.playing .state { color: #4ade80; }
  #list li.failed .state { color: #f87171; }
  #list li button { padding: 2px 8px; font-size: 12px; }
  #status { color: var(--dim); font-size: 13px; margin-top: 6px; min-height: 1.2em; }
  .error { color: #f87171; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view">
    <div id="stage">
      <video id="idle" muted loop playsinline preload="auto"></video>
      <video id="a" muted playsinline></video>
      <video id="b" muted playsinline></video>
      <div class="live">LIVE</div>
      <div class="clock" id="clock"></div>
    </div>
  </div>
  <form id="panel" autocomplete="off">
    <div>
      <textarea id="text" dir="auto" placeholder="What she should say (Urdu, Hinglish or English). Ctrl+Enter to speak."></textarea>
      <div class="row">
        <select id="voice" title="Her voice">
          <option value="ur-PK-UzmaNeural">Urdu: Uzma</option>
          <option value="ur-IN-GulNeural">Urdu: Gul</option>
          <option value="hi-IN-SwaraNeural">Hindi: Swara</option>
          <option value="en-IN-NeerjaNeural">English: Neerja</option>
        </select>
        <select id="rate" title="How fast she speaks">
          <option value="-10%">a little slower</option>
          <option value="+0%" selected>normal pace</option>
          <option value="+10%">a little faster</option>
        </select>
        <label class="file" title="Or recordings of her voice (several at once: in name order)">Voice files&hellip;<input type="file" id="file" accept="audio/*" multiple></label>
        <label><input type="checkbox" id="auto" checked> speak as soon as ready</label>
        <button class="go" id="go" type="submit">Speak</button>
      </div>
      <div id="status"></div>
    </div>
    <ul id="list"></ul>
  </form>
</div>
<script>
"use strict";
let token = "__TOKEN__";                       // filled in by the server for this page
const LEAD = (() => {                          // her voice is played this much before her pictures
  const asked = new URLSearchParams(location.search).get("lipLag");
  const ms = asked === null || asked.trim() === "" ? NaN : Number(asked);
  return Number.isFinite(ms) ? Math.min(150, Math.max(0, ms)) / 1000 : 0.05;
})();
const TYPE = 'video/mp4; codecs="avc1.4d401f"';
const $ = (id) => document.getElementById(id);
const idle = $("idle");
const players = [$("a"), $("b")];
const q = (path) => `${path}${path.includes("?") ? "&" : "?"}t=${encodeURIComponent(token)}`;
const sid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^0-9a-z]/gi, "").slice(0, 32);

let health = null;
let ctx = null;                                // her voice is played through this, so it can wait for her pictures
const items = [];
let nextId = 1;
let rendering = null;                          // the item being drawn
let playing = null;                            // the item being spoken
let lastPlayer = 1;
const work = [];                               // recent seconds of drawing per slice

// ---------------------------------------------------------------- the page
const status = (text, error = false) => { $("status").textContent = text; $("status").className = error ? "error" : ""; };
const clock = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
clock();
setInterval(clock, 1000);
// The token lasts two hours; a fresh one every half hour.
setInterval(() => fetch("/live/token").then((r) => r.json()).then((j) => { if (j.token) token = j.token; }).catch(() => {}), 30 * 60 * 1000);

function fitPanel() {
  const panel = $("panel");
  document.documentElement.style.setProperty("--bar", document.body.classList.contains("full") ? "0px" : `${panel.offsetHeight}px`);
}
window.addEventListener("resize", fitPanel);

async function boot() {
  try {
    const res = await fetch(q("/health"), { cache: "no-store" });
    if (!res.ok) throw new Error(`the server answered ${res.status}`);
    health = await res.json();
  } catch (err) {
    status(`No server: ${err.message}. Is live.sh running?`, true);
    return;
  }
  $("stage").style.backgroundImage = `url("${q("/still.jpg")}")`;
  if (health.idle_frames) {
    idle.src = q("/idle.mp4");
    idle.play().catch(() => {});
  }
  const second = health.work_seconds && health.slice_frames ? health.work_seconds * health.fps / health.slice_frames : 0;
  status(second ? `Ready. One second of her takes ${second.toFixed(2)} s to draw on this card${second > 1 ? ": a long text waits a little before she starts" : ""}.` : "Ready.");
  fitPanel();
}

function draw() {
  const list = $("list");
  list.innerHTML = "";
  for (const item of items.slice().reverse()) {
    const li = document.createElement("li");
    li.className = item.state;
    const what = document.createElement("span");
    what.className = "what";
    what.dir = "auto";
    what.textContent = item.label;
    const state = document.createElement("span");
    state.className = "state";
    state.textContent = describe(item);
    li.append(what, state);
    if (item.state === "drawing" || item.state === "ready") {
      const play = document.createElement("button");
      play.type = "button";
      play.textContent = "▶";
      play.title = "Speak it now";
      play.disabled = Boolean(playing) || !canStart(item);
      play.onclick = () => start(item);
      li.append(play);
    }
    list.append(li);
  }
}

function describe(item) {
  if (item.state === "waiting") return "waiting";
  if (item.state === "voice") return "making her voice";
  if (item.state === "drawing") return `drawing ${Math.round((100 * item.pieces.length) / item.slices.length)}%${item.eta ? `, ~${Math.ceil(item.eta)} s` : ""}`;
  if (item.state === "ready") return "ready";
  if (item.state === "playing") return "speaking";
  if (item.state === "done") return "done";
  return `failed: ${item.error || ""}`;
}

// ---------------------------------------------------------------- one text: voice, slices, pictures
function add(text, file) {
  const label = file ? file.name : text.replace(/\s+/g, " ").slice(0, 80);
  items.push({ id: nextId++, text, file, label, state: "waiting", pieces: [], slices: [], buffer: null });
  draw();
  pump();
}

async function pump() {
  if (rendering || !health) return;
  const item = items.find((i) => i.state === "waiting");
  if (!item) return;
  rendering = item;
  try {
    item.state = "voice";
    draw();
    await voice(item);
    item.state = "drawing";
    draw();
    await pictures(item);
    if (item.state === "drawing") item.state = "ready";
  } catch (err) {
    item.state = "failed";
    item.error = err.message;
    status(`Could not prepare "${item.label.slice(0, 40)}": ${err.message}`, true);
  }
  rendering = null;
  draw();
  consider();
  pump();
}

async function voice(item) {
  let bytes;
  if (item.file) {
    bytes = await item.file.arrayBuffer();
  } else {
    const res = await fetch(q("/tts"), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text: item.text, voice: $("voice").value, rate: $("rate").value }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `her voice: ${res.status}`);
    bytes = await res.arrayBuffer();
  }
  item.buffer = await ctx.decodeAudioData(bytes);
  // The model hears her at 16 kHz, in whole slices, and one slice of quiet after her last word
  // so that it has its pictures too.
  const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(item.buffer.duration * 16000)), 16000);
  const source = offline.createBufferSource();
  source.buffer = item.buffer;
  source.connect(offline.destination);
  source.start();
  const pcm = (await offline.startRendering()).getChannelData(0);
  const per = Math.round((health.slice_frames * 16000) / health.fps);
  const count = Math.ceil(pcm.length / per) + 1;
  for (let n = 0; n < count; n++) {
    const slice = new Float32Array(per);
    slice.set(pcm.subarray(n * per, Math.min(pcm.length, (n + 1) * per)));
    item.slices.push(slice);
  }
}

function wav(samples) {
  const out = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const text = (at, s) => { for (let i = 0; i < s.length; i++) out.setUint8(at + i, s.charCodeAt(i)); };
  text(0, "RIFF"); out.setUint32(4, 36 + samples.length * 2, true); text(8, "WAVE"); text(12, "fmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  text(36, "data"); out.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 0x7fff, true);
  return out.buffer;
}

async function pictures(item) {
  for (let n = 0; n < item.slices.length; n++) {
    const began = performance.now();
    // One name for the page; slice 0 starts her from her settled pose again.
    const res = await fetch(q(`/say?sid=${sid}&seq=${n}`), { method: "POST", body: new Blob([wav(item.slices[n])]) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `her pictures: ${res.status}`);
    const piece = new Uint8Array(await res.arrayBuffer());
    work.push((performance.now() - began) / 1000);
    if (work.length > 12) work.shift();
    item.pieces.push(piece);
    if (item.reel) item.reel.add(piece);
    const left = item.slices.length - item.pieces.length;
    item.eta = left * perSlice();
    draw();
    consider();
  }
  item.eta = 0;
}

// ---------------------------------------------------------------- when she may start
const sliceSeconds = () => health.slice_frames / health.fps;
function perSlice() {
  const recent = work.slice(-6);
  const seen = recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0;
  const told = health.work_seconds ? health.work_seconds + 0.15 : sliceSeconds();
  return 1.1 * (seen || told);
}
// She may start now if every slice will be here before it is due, drawing on at the recent pace.
function canStart(item) {
  if (!item.buffer || !item.slices.length || !item.pieces.length) return false;
  const total = item.slices.length;
  const done = item.pieces.length;
  if (done >= total) return true;
  const s = sliceSeconds();
  const w = perSlice();
  const margin = 0.5 + LEAD;
  const ok = (k) => (k - done + 1) * w <= k * s - margin;
  return ok(done) && ok(total - 1);
}
function consider() {
  if (playing || !$("auto").checked) return;
  const item = items.find((i) => i.state === "drawing" || i.state === "ready");
  if (item && item === items.find((i) => ["waiting", "voice", "drawing", "ready"].includes(i.state)) && canStart(item)) start(item);
}

// ---------------------------------------------------------------- speaking
class Reel {
  constructor(video) {
    this.video = video;
    this.queue = [];
    this.busy = false;
    this.end = 0;
    this.source = new MediaSource();
    this.url = URL.createObjectURL(this.source);
    video.src = this.url;
    this.opened = new Promise((ok) => this.source.addEventListener("sourceopen", () => {
      this.buffer = this.source.addSourceBuffer(TYPE);
      this.buffer.addEventListener("updateend", () => { this.busy = false; this.next(); });
      ok();
    }, { once: true }));
  }
  add(piece) { this.queue.push(piece); this.next(); }
  async next() {
    await this.opened;
    if (this.busy || !this.queue.length || !this.buffer) return;
    this.busy = true;
    const ranges = this.buffer.buffered;
    this.buffer.timestampOffset = ranges.length ? ranges.end(ranges.length - 1) : 0;
    this.buffer.appendBuffer(this.queue.shift());
  }
  get have() { const r = this.buffer && this.buffer.buffered; return r && r.length ? r.end(r.length - 1) : 0; }
  close() {
    this.video.pause();
    this.video.removeAttribute("src");
    this.video.load();
    URL.revokeObjectURL(this.url);
  }
}

function start(item) {
  if (playing || !ctx) return;
  playing = item;
  item.state = "playing";
  lastPlayer = 1 - lastPlayer;
  const video = players[lastPlayer];
  item.video = video;
  item.reel = new Reel(video);
  for (const piece of item.pieces) item.reel.add(piece);
  if (ctx.state === "suspended") ctx.resume();
  const voiceNode = ctx.createBufferSource();
  voiceNode.buffer = item.buffer;
  voiceNode.connect(ctx.destination);
  item.at = ctx.currentTime + 0.25;
  voiceNode.start(item.at);
  voiceNode.onended = () => finish(item);
  item.node = voiceNode;
  item.shown = false;
  status("Speaking.");
  draw();
}

function finish(item) {
  if (playing !== item) return;
  item.video.style.opacity = 0;
  const reel = item.reel;
  setTimeout(() => reel.close(), 400);
  item.reel = null;
  item.state = "done";
  playing = null;
  status("");
  draw();
  consider();
}

const latency = () => Math.min(0.2, (ctx && (ctx.outputLatency || ctx.baseLatency)) || 0);
// Every 40 ms: the picture for the moment of her voice being heard; her voice waits when the
// picture is not drawn yet.
setInterval(() => {
  const item = playing;
  if (!item || !item.reel) return;
  const video = item.video;
  const want = ctx.currentTime - item.at - latency() - LEAD;
  const drawnAll = item.pieces.length >= item.slices.length;
  const have = item.reel.have;
  if (!drawnAll && want > have - 0.1) {
    if (ctx.state === "running") { ctx.suspend(); status("Her pictures are behind: waiting for them."); }
    if (!video.paused) video.pause();
    return;
  }
  if (ctx.state === "suspended") {
    if (drawnAll || have >= want + Math.min(3, 2 * sliceSeconds())) { ctx.resume(); status("Speaking."); }
    return;
  }
  if (want < 0) return;
  const behind = want - video.currentTime;
  if (Math.abs(behind) > 0.12) {
    if (!video.seeking) video.currentTime = Math.max(0, want);
  } else {
    video.playbackRate = 1 + Math.max(-0.08, Math.min(0.08, behind * 2));
  }
  if (video.paused) video.play().catch(() => {});
  if (!item.shown && video.readyState >= 2 && !video.seeking) {
    item.shown = true;
    video.style.opacity = 1;
  }
}, 40);

// ---------------------------------------------------------------- controls
function ensureAudio() {
  if (!ctx) ctx = new AudioContext();
  if (ctx.state === "suspended" && !playing) ctx.resume();
  idle.play().catch(() => {});
}
$("panel").addEventListener("submit", (event) => {
  event.preventDefault();
  ensureAudio();
  const text = $("text").value.trim();
  if (!text) return status("Type what she should say first.", true);
  add(text, null);
  $("text").value = "";
});
$("file").addEventListener("change", (event) => {
  ensureAudio();
  // Several at once (a whole dub made beforehand): one item each, in the order of their names.
  const files = [...(event.target.files || [])].sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true }));
  for (const file of files) add("", file);
  event.target.value = "";
});
$("auto").addEventListener("change", () => { draw(); consider(); });
document.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    $("go").click();
    return;
  }
  if (event.target.tagName === "TEXTAREA") return;
  const key = event.key.toLowerCase();
  if (key === "f") {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  } else if (key === "t") {
    document.body.classList.toggle("show");
  }
});
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("full", Boolean(document.fullscreenElement));
  document.body.classList.remove("show");
  fitPanel();
});
setInterval(draw, 1000);
boot();
</script>
</body>
</html>
